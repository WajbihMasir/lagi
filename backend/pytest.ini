[pytest]
# B4: xdist -n 2 --dist loadscope. asyncio in session loop so Motor's client
# (created at import time in server.py) stays on one loop across tests.
required_plugins = pytest-xdist pytest-asyncio
addopts = -n 2 --dist loadscope
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
